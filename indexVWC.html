<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>VWC · Organigram</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    :root {
      --ink: #0E1A14;
      --ink-2: #1C2A22;
      --cream: #F4EDE0;
      --cream-2: #EBE2D1;
      --gold: #C9A64A;
      --gold-2: #DAB331;
      --gold-deep: #8E7327;
      --taupe: #B9AA86;
      --mute: #6B6450;

      --dept-md: #C9A64A;
      --dept-op: #4A8C6F;
      --dept-sec: #A8443B;
      --dept-pub: #5777A8;
      --dept-sup: #A0772C;

      --site-ext1: #8E7327;
      --site-ext2: #B85C3A;
      --site-proc: #3F6E58;

      --line: rgba(201, 166, 74, 0.55);

      --serif: "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
      --sans:  "Inter", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      font-family: var(--sans);
      color: var(--ink);
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(201,166,74,0.10), transparent 60%),
        radial-gradient(1000px 500px at 100% 110%, rgba(14,26,20,0.05), transparent 60%),
        var(--cream);
      -webkit-font-smoothing: antialiased;
    }

    .app { min-height: 100vh; display: flex; flex-direction: column; }
    .topbar {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; gap: 18px;
      padding: 14px 28px;
      background: rgba(14, 26, 20, 0.96);
      color: var(--cream);
      border-bottom: 1px solid rgba(201,166,74,0.35);
      backdrop-filter: blur(6px);
    }
    .brand { display: flex; align-items: center; gap: 14px; }
    .brand .logo {
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--ink); border: 2px solid var(--gold-2);
      overflow: hidden;
    }
    .brand .logo img { width: 100%; height: 100%; }
    .brand .name {
      font-family: var(--serif); font-weight: 600;
      letter-spacing: 0.18em; font-size: 18px; color: var(--cream);
    }
    .brand .sub {
      font-size: 10px; letter-spacing: 0.32em;
      color: var(--gold-2); text-transform: uppercase; margin-top: 2px;
    }
    .topbar-title {
      flex: 1; text-align: center;
      font-family: var(--serif); font-size: 22px;
      letter-spacing: 0.08em; color: var(--cream);
    }
    .topbar-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn {
      font-size: 12px; font-weight: 500; letter-spacing: 0.04em;
      padding: 8px 14px; border-radius: 999px;
      border: 1px solid rgba(201,166,74,0.45);
      background: transparent; color: var(--cream);
      cursor: pointer; transition: all .15s ease;
    }
    .btn:hover { background: rgba(201,166,74,0.12); border-color: var(--gold-2); }
    .btn.primary { background: var(--gold-2); color: var(--ink); border-color: var(--gold-2); }
    .btn.primary:hover { background: var(--gold); border-color: var(--gold); }
    .btn.danger:hover { background: rgba(168, 68, 59, 0.2); border-color: #a8443b; color: #f4cfca; }

    .canvas { flex: 1; overflow: auto; padding: 56px 48px 96px; }
    .stage { min-width: max-content; margin: 0 auto; }

    .page-header { text-align: center; margin-bottom: 28px; }
    .page-header .eyebrow {
      letter-spacing: 0.4em; font-size: 11px;
      color: var(--gold-deep); text-transform: uppercase;
    }
    .page-header h1 {
      font-family: var(--serif); font-weight: 600; font-size: 42px;
      margin: 8px 0 4px; color: var(--ink); letter-spacing: 0.02em;
    }
    .page-header .rule {
      width: 64px; height: 1px; background: var(--gold); margin: 16px auto;
    }
    .page-header p { color: var(--mute); font-size: 13px; margin: 0; letter-spacing: 0.04em; }

    /* Site legend / editor */
    .legend {
      display: flex; justify-content: center; gap: 22px;
      margin: 8px auto 36px; flex-wrap: wrap;
      font-size: 11px; letter-spacing: 0.12em;
      text-transform: uppercase; color: var(--mute);
    }
    .legend .item {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(244,237,224,0.7);
      border: 1px solid rgba(14,26,20,0.06);
    }
    .legend .swatch {
      width: 10px; height: 10px; border-radius: 50%;
      border: 1px solid rgba(14,26,20,0.2);
    }
    .legend .swatch[data-site="ext1"] { background: var(--site-ext1); }
    .legend .swatch[data-site="ext2"] { background: var(--site-ext2); }
    .legend .swatch[data-site="proc"] { background: var(--site-proc); }
    .legend .short, .legend .label {
      outline: none; cursor: text;
    }
    .legend .short {
      font-weight: 700; color: var(--ink); padding: 0 2px;
    }
    .legend .dot { opacity: 0.4; }
    .legend .short:focus, .legend .label:focus {
      background: rgba(201,166,74,0.15);
      box-shadow: inset 0 0 0 1px rgba(201,166,74,0.4);
      border-radius: 3px;
    }

    /* Tree (CSS) */
    .tree { display: flex; justify-content: center; }
    .tree ul {
      padding: 28px 0 0; position: relative;
      display: flex; justify-content: center;
      list-style: none; margin: 0; gap: 16px;
    }
    .tree li {
      position: relative; list-style: none;
      padding: 28px 14px 0; text-align: center;
    }
    .tree li::before, .tree li::after {
      content: ''; position: absolute; top: 0;
      right: 50%; width: 50%; height: 28px;
      border-top: 1.5px solid var(--line);
    }
    .tree li::after {
      right: auto; left: 50%;
      border-left: 1.5px solid var(--line);
    }
    .tree li:only-child::before, .tree li:only-child::after { display: none; }
    .tree li:only-child { padding-top: 28px; }
    .tree li:first-child::before { border: 0; }
    .tree li:last-child::after { border: 0; }
    .tree li:last-child::before {
      border-right: 1.5px solid var(--line);
      border-radius: 0 6px 0 0;
    }
    .tree li:first-child::after { border-radius: 6px 0 0 0; }
    .tree ul ul::before {
      content: ''; position: absolute; top: 0; left: 50%;
      width: 1.5px; height: 28px; background: var(--line);
    }

    /* Node */
    .node {
      position: relative; display: inline-block;
      min-width: 200px; max-width: 240px;
      padding: 14px 16px;
      background: var(--cream);
      border: 1px solid rgba(14,26,20,0.10);
      border-radius: 6px;
      box-shadow: 0 1px 2px rgba(14,26,20,0.04), 0 6px 18px rgba(14,26,20,0.06);
      text-align: left;
      transition: box-shadow .18s ease, transform .18s ease, border-color .18s ease;
      cursor: grab;
    }
    .node:active { cursor: grabbing; }
    .node:hover {
      box-shadow: 0 1px 2px rgba(14,26,20,0.06), 0 14px 36px rgba(14,26,20,0.14);
      border-color: rgba(201,166,74,0.6);
      transform: translateY(-1px);
    }
    .node.selected {
      border-color: var(--gold);
      box-shadow: 0 0 0 2px rgba(201,166,74,0.22), 0 12px 30px rgba(14,26,20,0.14);
    }
    .node.dragging { opacity: 0.45; }
    .node.drop-target {
      border-color: var(--gold-2);
      box-shadow: 0 0 0 3px rgba(201,166,74,0.35), 0 12px 30px rgba(14,26,20,0.14);
      transform: translateY(-2px);
    }

    .node .accent {
      position: absolute; left: 0; top: 0; bottom: 0;
      width: 4px; border-radius: 6px 0 0 6px;
      background: var(--dept-md);
    }
    .node[data-dept="md"]  .accent { background: var(--dept-md); }
    .node[data-dept="op"]  .accent { background: var(--dept-op); }
    .node[data-dept="sec"] .accent { background: var(--dept-sec); }
    .node[data-dept="pub"] .accent { background: var(--dept-pub); }
    .node[data-dept="sup"] .accent { background: var(--dept-sup); }

    .node .role {
      font-size: 10px; letter-spacing: 0.22em;
      text-transform: uppercase; color: var(--gold-deep);
      margin: 0 0 6px; outline: none;
    }
    .node .name {
      font-family: var(--serif); font-weight: 600;
      font-size: 18px; color: var(--ink);
      line-height: 1.2; margin: 0; outline: none;
    }
    .node .name[contenteditable="true"]:focus,
    .node .role[contenteditable="true"]:focus {
      background: rgba(201,166,74,0.12);
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(201,166,74,0.4);
      padding: 1px 4px;
      margin-left: -4px; margin-right: -4px;
    }

    .node.root {
      background: var(--ink); color: var(--cream);
      border-color: var(--gold-2);
      min-width: 240px; padding: 18px 20px;
    }
    .node.root::before {
      content: ''; position: absolute; inset: 4px;
      border: 1px solid rgba(201,166,74,0.32);
      border-radius: 4px; pointer-events: none;
    }
    .node.root .role { color: var(--gold-2); }
    .node.root .name { color: var(--cream); }
    .node.root .accent { display: none; }

    .node.group {
      background: linear-gradient(180deg, #1C2A22 0%, #0E1A14 100%);
      color: var(--cream);
      border-color: rgba(201,166,74,0.4);
      min-width: 240px; padding: 12px 18px 14px; text-align: center;
      max-width: 380px;
    }
    .node.group .accent { display: none; }
    .node.group .role {
      color: var(--gold-2);
      font-size: 9px; letter-spacing: 0.34em;
      margin: 0 0 2px;
    }
    .node.group .name {
      font-size: 16px; color: var(--cream); letter-spacing: 0.04em;
    }
    .node.group .site-chips { justify-content: center; margin-top: 6px; }

    /* Site chips on cards */
    .site-chips {
      display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px;
    }
    .site-chip {
      font-size: 9px; letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 2px 7px; border-radius: 999px;
      border: 1px solid currentColor;
      color: var(--mute);
      background: transparent;
      opacity: 0.32;
      cursor: default;
      transition: opacity .15s ease, transform .15s ease, background .15s ease;
      user-select: none;
      line-height: 1.4;
      font-weight: 500;
    }
    .site-chip.active { opacity: 1; font-weight: 700; }
    .site-chip[data-site="ext1"].active { color: var(--site-ext1); background: rgba(142,115,39,0.12); }
    .site-chip[data-site="ext2"].active { color: var(--site-ext2); background: rgba(184,92,58,0.12); }
    .site-chip[data-site="proc"].active { color: var(--site-proc); background: rgba(63,110,88,0.12); }
    .node.selected .site-chip { cursor: pointer; }
    .node.selected .site-chip:hover { transform: translateY(-1px); opacity: 1; }
    .node.group .site-chip { border-color: rgba(244,237,224,0.35); color: rgba(244,237,224,0.6); }
    .node.group .site-chip.active { color: var(--cream); background: rgba(201,166,74,0.2); border-color: var(--gold-2); }

    /* Action buttons on node */
    .node .actions {
      position: absolute;
      top: -14px; right: -8px;
      display: flex; gap: 4px;
      opacity: 0; transform: translateY(-4px);
      transition: opacity .15s ease, transform .15s ease;
      pointer-events: none;
    }
    .node:hover .actions, .node.selected .actions, .node:focus-within .actions {
      opacity: 1; transform: translateY(0); pointer-events: auto;
    }
    .node-btn {
      width: 26px; height: 26px; border-radius: 50%;
      background: var(--ink); color: var(--cream);
      border: 1px solid var(--gold-2);
      font-size: 14px; font-weight: 600; line-height: 1;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; padding: 0;
      box-shadow: 0 4px 10px rgba(14,26,20,0.25);
      transition: background .15s ease, transform .15s ease;
    }
    .node-btn:hover { background: var(--gold-2); color: var(--ink); transform: translateY(-1px); }
    .node-btn.del:hover { background: #a8443b; color: var(--cream); border-color: #a8443b; }
    .node-btn.swap { font-size: 12px; }

    .node .below {
      position: absolute; left: 50%;
      transform: translate(-50%, 6px);
      bottom: -20px;
      display: flex; gap: 6px;
      opacity: 0;
      transition: opacity .15s ease, transform .15s ease;
      pointer-events: none;
      z-index: 5;
    }
    .node:hover .below, .node.selected .below {
      opacity: 1; transform: translate(-50%, 0); pointer-events: auto;
    }
    .pill-btn {
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      padding: 5px 10px; border-radius: 999px;
      background: var(--cream); color: var(--ink);
      border: 1px solid var(--gold);
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(14,26,20,0.12);
      transition: all .15s ease; white-space: nowrap;
    }
    .pill-btn:hover { background: var(--gold-2); border-color: var(--gold-2); }

    .tip {
      position: fixed; bottom: 18px; left: 50%;
      transform: translateX(-50%);
      background: rgba(14,26,20,0.94);
      color: var(--cream); font-size: 12px;
      letter-spacing: 0.04em; padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(201,166,74,0.4);
      box-shadow: 0 12px 30px rgba(14,26,20,0.25);
      z-index: 40;
      display: flex; align-items: center; gap: 10px;
      max-width: 92vw;
    }
    .tip kbd {
      font-size: 10px;
      background: rgba(201,166,74,0.18);
      border: 1px solid rgba(201,166,74,0.4);
      padding: 2px 6px; border-radius: 4px;
      color: var(--gold-2);
    }
    .tip .x { cursor: pointer; opacity: 0.7; padding: 0 2px; }
    .tip .x:hover { opacity: 1; }

    .toast {
      position: fixed; top: 78px; left: 50%;
      transform: translateX(-50%);
      background: var(--ink); color: var(--cream);
      font-size: 12px; padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid var(--gold-2);
      box-shadow: 0 12px 30px rgba(14,26,20,0.3);
      z-index: 60;
      letter-spacing: 0.04em;
      animation: toast .25s ease both;
    }
    @keyframes toast {
      from { opacity: 0; transform: translate(-50%, -8px); }
      to   { opacity: 1; transform: translate(-50%, 0); }
    }

    .footer {
      font-size: 10px; letter-spacing: 0.3em;
      text-transform: uppercase; color: var(--mute);
      text-align: center; padding: 24px 0 8px;
    }

    /* Expand/collapse toggle */
    .expand-toggle {
      position: absolute;
      bottom: -11px; left: 50%;
      transform: translateX(-50%);
      background: var(--cream); color: var(--ink);
      border: 1px solid var(--gold);
      border-radius: 999px;
      padding: 2px 9px 3px;
      font-size: 9px; letter-spacing: 0.14em;
      cursor: pointer; z-index: 6;
      display: inline-flex; align-items: center; gap: 5px;
      white-space: nowrap; line-height: 1;
      box-shadow: 0 4px 10px rgba(14,26,20,0.18);
      transition: all .15s ease;
      font-weight: 600;
    }
    .expand-toggle:hover {
      background: var(--gold-2); border-color: var(--gold-2);
    }
    .expand-toggle .chev { font-size: 11px; line-height: 1; }
    .node.group .expand-toggle, .node.root .expand-toggle {
      background: var(--ink); color: var(--gold-2);
      border-color: var(--gold-2);
    }
    .node.group .expand-toggle:hover, .node.root .expand-toggle:hover {
      background: var(--gold-2); color: var(--ink);
    }

    /* View-mode toggle button in actions row */
    .node-btn.view { font-size: 11px; }

    /* Compact roster list (viewMode === 'list' on a group) */
    .roster {
      margin: 12px -10px -2px;
      padding: 8px;
      background: rgba(0,0,0,0.22);
      border-radius: 5px;
      display: flex; flex-direction: column; gap: 5px;
      text-align: left;
    }
    .node:not(.group) .roster {
      background: rgba(14,26,20,0.06);
    }
    .roster-row {
      display: block;
      padding: 9px 34px 10px 11px;
      border-radius: 4px;
      background: rgba(244,237,224,0.05);
      position: relative;
      cursor: grab;
      transition: background .15s ease, box-shadow .15s ease, opacity .15s ease;
      text-align: left;
    }
    .node:not(.group) .roster-row {
      background: rgba(14,26,20,0.04);
    }
    .roster-row:active { cursor: grabbing; }
    .roster-row:hover { background: rgba(244,237,224,0.10); }
    .node:not(.group) .roster-row:hover { background: rgba(14,26,20,0.10); }
    .roster-row.selected {
      background: rgba(201,166,74,0.22);
      box-shadow: inset 0 0 0 1px var(--gold);
    }
    .roster-row.dragging { opacity: 0.45; }
    .roster-row.drop-target {
      box-shadow: inset 0 0 0 2px var(--gold-2);
      background: rgba(201,166,74,0.16);
    }
    .roster-row .row-main {
      display: block;
      text-align: left;
      min-width: 0;
    }
    .roster-row .row-main > div {
      max-width: 100%;
      word-break: break-word;
    }
    .roster-row .row-role {
      font-size: 8.5px; letter-spacing: 0.26em;
      text-transform: uppercase; color: var(--gold-2);
      outline: none; font-weight: 700;
      margin: 0 0 2px;
      display: block;
    }
    .node:not(.group) .roster-row .row-role { color: var(--gold-deep); }
    .roster-row .row-name {
      font-family: var(--serif); font-weight: 600;
      font-size: 15px; color: var(--cream);
      outline: none; line-height: 1.18;
      display: block;
      margin: 0;
    }
    .node:not(.group) .roster-row .row-name { color: var(--ink); }
    .roster-row .row-name[contenteditable="true"]:focus,
    .roster-row .row-role[contenteditable="true"]:focus {
      background: rgba(201,166,74,0.22);
      box-shadow: inset 0 0 0 1px rgba(201,166,74,0.5);
      border-radius: 2px;
      padding: 0 3px; margin: 0 -3px;
    }
    .roster-row .site-chips {
      flex-wrap: wrap;
      gap: 4px;
      margin-top: 7px;
    }
    .roster-row .site-chip {
      font-size: 8.5px; padding: 2px 6px; letter-spacing: 0.16em;
    }
    .roster-del {
      position: absolute;
      top: 6px; right: 6px;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: transparent;
      color: rgba(244,237,224,0.55);
      border: 1px solid transparent;
      font-size: 14px; line-height: 1;
      cursor: pointer; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      transition: all .12s ease;
    }
    .node:not(.group) .roster-del { color: rgba(14,26,20,0.4); }
    .roster-del:hover {
      background: rgba(168,68,59,0.3);
      border-color: #a8443b;
      color: var(--cream);
    }
    .roster-add {
      margin-top: 6px;
      font-size: 9px; letter-spacing: 0.18em;
      text-transform: uppercase; font-weight: 600;
      padding: 5px 10px; border-radius: 999px;
      background: transparent;
      border: 1px dashed rgba(201,166,74,0.5);
      color: rgba(244,237,224,0.75);
      cursor: pointer;
      align-self: center;
      transition: all .15s ease;
    }
    .node:not(.group) .roster-add { color: var(--gold-deep); border-color: rgba(201,166,74,0.6); }
    .roster-add:hover { color: var(--cream); border-color: var(--gold-2); background: rgba(201,166,74,0.1); }
    .node:not(.group) .roster-add:hover { color: var(--ink); background: rgba(201,166,74,0.15); }

    @media print {
      .topbar, .tip, .toast { display: none !important; }
      .expand-toggle { display: none !important; }
      body { background: #fff; }
      .canvas { overflow: visible; padding: 24px; }
      .node:hover .actions, .node:hover .below { opacity: 0 !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react">

    const STORAGE_KEY_TREE  = "vwc_organigram_v5_tree";
    const STORAGE_KEY_SITES = "vwc_organigram_v5_sites";
    const TIP_KEY = "vwc_organigram_v5_tip";

    const uid = () => "n_" + Math.random().toString(36).slice(2, 9);

    /* ---------- Tree helpers ---------- */
    function mapTree(node, fn) {
      const next = fn(node) ?? node;
      return { ...next, children: (next.children || []).map(c => mapTree(c, fn)) };
    }
    function updateNode(tree, id, patch) {
      return mapTree(tree, n => n.id === id ? { ...n, ...patch } : n);
    }
    function findNode(tree, id) {
      if (tree.id === id) return tree;
      for (const c of (tree.children || [])) { const r = findNode(c, id); if (r) return r; }
      return null;
    }
    function findParent(tree, id, parent = null) {
      if (tree.id === id) return parent;
      for (const c of (tree.children || [])) {
        const r = findParent(c, id, tree); if (r) return r;
      }
      return null;
    }
    function isDescendant(node, id) {
      if (node.id === id) return true;
      return (node.children || []).some(c => isDescendant(c, id));
    }
    function addChild(tree, parentId) {
      return mapTree(tree, n => {
        if (n.id !== parentId) return n;
        const child = {
          id: uid(), type: "person",
          name: "New member", role: "Role",
          dept: n.dept || "md",
          sites: [...(n.sites || [])],
          children: []
        };
        return { ...n, children: [...(n.children || []), child] };
      });
    }
    function deleteNode(tree, id) {
      if (tree.id === id) return tree;
      const recur = node => ({
        ...node,
        children: (node.children || []).filter(c => c.id !== id).map(recur)
      });
      return recur(tree);
    }
    function toggleSite(tree, id, siteId) {
      return mapTree(tree, n => {
        if (n.id !== id) return n;
        const has = (n.sites || []).includes(siteId);
        const sites = has ? n.sites.filter(s => s !== siteId) : [...(n.sites || []), siteId];
        return { ...n, sites };
      });
    }
    function setNodeType(tree, id, type) {
      return mapTree(tree, n => n.id === id ? { ...n, type } : n);
    }
    function setCollapsed(tree, id, v) {
      return mapTree(tree, n => n.id === id ? { ...n, collapsed: v } : n);
    }
    function setViewMode(tree, id, mode) {
      return mapTree(tree, n => n.id === id ? { ...n, viewMode: mode } : n);
    }
    function setCollapsedAll(tree, v, groupsOnly) {
      return mapTree(tree, n => {
        if (n.id === tree.id) return n; // never collapse root
        if (groupsOnly && n.type !== "group") return n;
        if (!(n.children && n.children.length)) return n;
        return { ...n, collapsed: v };
      });
    }
    function getViewMode(n) {
      if (n.viewMode === "tree" || n.viewMode === "list") return n.viewMode;
      return n.type === "group" ? "list" : "tree";
    }
    function reparent(tree, draggedId, newParentId) {
      const node = findNode(tree, draggedId);
      if (!node) return tree;
      if (draggedId === newParentId) return tree;
      if (isDescendant(node, newParentId)) return tree; // no cycles
      // Remove from old parent
      let removed = null;
      const t1 = (function recur(n){
        const kids = (n.children || []);
        const idx = kids.findIndex(c => c.id === draggedId);
        if (idx >= 0) {
          removed = kids[idx];
          return { ...n, children: kids.slice(0, idx).concat(kids.slice(idx + 1)).map(recur) };
        }
        return { ...n, children: kids.map(recur) };
      })(tree);
      if (!removed) return tree;
      // Insert into new parent
      const t2 = mapTree(t1, n => n.id === newParentId
        ? { ...n, children: [...(n.children || []), removed] }
        : n
      );
      return t2;
    }

    /* ---------- URL state sharing ---------- */
    function encodeStateToHash(state) {
      try {
        const json = JSON.stringify(state);
        const b64 = btoa(unescape(encodeURIComponent(json)));
        return b64;
      } catch (e) { return null; }
    }
    function decodeStateFromHash(hash) {
      try {
        if (!hash) return null;
        const m = hash.match(/data=([A-Za-z0-9+/=_-]+)/);
        if (!m) return null;
        const json = decodeURIComponent(escape(atob(m[1])));
        return JSON.parse(json);
      } catch (e) { return null; }
    }

    /* ---------- Editable text ---------- */
    function selectAllIn(el) {
      try {
        const range = document.createRange();
        range.selectNodeContents(el);
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      } catch (e) {}
    }
    function Editable({ value, onChange, className, placeholder, onClick }) {
      const ref = useRef(null);
      // Initialize textContent on mount and whenever value changes externally
      // (e.g. via Reset / Import). We never write textContent while the user is
      // typing into this element — that would reset their caret to position 0.
      useEffect(() => {
        if (!ref.current) return;
        if (document.activeElement === ref.current) return;
        if (ref.current.textContent !== value) ref.current.textContent = value;
      }, [value]);
      return (
        <div
          ref={ref}
          className={className}
          contentEditable
          suppressContentEditableWarning
          spellCheck={false}
          onInput={e => onChange(e.currentTarget.textContent || "")}
          onKeyDown={e => {
            if (e.key === "Enter") { e.preventDefault(); e.currentTarget.blur(); }
            if (e.key === "Escape") { e.currentTarget.blur(); }
            if ((e.metaKey || e.ctrlKey) && (e.key === "a" || e.key === "A")) {
              e.preventDefault();
              selectAllIn(e.currentTarget);
            }
          }}
          onMouseDown={e => {
            e.stopPropagation();
            if (document.activeElement !== e.currentTarget) {
              e.preventDefault();
              e.currentTarget.focus();
              requestAnimationFrame(() => selectAllIn(e.currentTarget));
            }
          }}
          onClick={e => { e.stopPropagation(); onClick && onClick(); }}
          onFocus={e => {
            requestAnimationFrame(() => {
              if (document.activeElement === e.target) {
                const sel = window.getSelection();
                if (sel && sel.isCollapsed) selectAllIn(e.target);
              }
            });
          }}
          onDragStart={e => { e.preventDefault(); e.stopPropagation(); }}
          data-placeholder={placeholder}
        />
      );
    }

    /* ---------- Site chips ---------- */
    function SiteChips({ sites, active, selected, onToggle }) {
      return (
        <div className="site-chips">
          {sites.map(s => {
            const isActive = (active || []).includes(s.id);
            return (
              <span
                key={s.id}
                className={"site-chip" + (isActive ? " active" : "")}
                data-site={s.id}
                title={s.label + (selected ? " — click to toggle" : "")}
                onMouseDown={e => e.stopPropagation()}
                onClick={e => {
                  if (!selected) return;
                  e.stopPropagation();
                  onToggle(s.id);
                }}
              >{s.short}</span>
            );
          })}
        </div>
      );
    }

    /* ---------- Roster row (compact list) ---------- */
    function RosterRow(props) {
      const {
        node, selected, sites,
        dragId, dropTargetId,
        onSelect, onChange, onDelete, onToggleSite,
        onDragStart, onDragOver, onDragLeave, onDrop, onDragEnd
      } = props;
      const isDragging = dragId === node.id;
      const isDropTarget = dropTargetId === node.id;
      return (
        <div
          className={
            "roster-row" +
            (selected ? " selected" : "") +
            (isDragging ? " dragging" : "") +
            (isDropTarget ? " drop-target" : "")
          }
          draggable={true}
          onClick={e => { e.stopPropagation(); onSelect(node.id); }}
          onDragStart={e => { e.stopPropagation(); onDragStart(e, node.id); }}
          onDragEnd={onDragEnd}
          onDragOver={e => { e.stopPropagation(); onDragOver(e, node.id); }}
          onDragLeave={e => onDragLeave(e, node.id)}
          onDrop={e => { e.stopPropagation(); onDrop(e, node.id); }}
        >
          <div className="row-main">
            <Editable
              className="row-role"
              value={node.role}
              onChange={v => onChange(node.id, { role: v })}
              placeholder="Role"
              onClick={() => onSelect(node.id)}
            />
            <Editable
              className="row-name"
              value={node.name}
              onChange={v => onChange(node.id, { name: v })}
              placeholder="Name"
              onClick={() => onSelect(node.id)}
            />
          </div>
          <SiteChips
            sites={sites}
            active={node.sites}
            selected={selected}
            onToggle={(siteId) => onToggleSite(node.id, siteId)}
          />
          <button
            className="roster-del"
            title="Remove"
            onMouseDown={e => e.stopPropagation()}
            onClick={e => { e.stopPropagation(); onDelete(node.id); }}
          >×</button>
        </div>
      );
    }

    /* ---------- Node ---------- */
    function NodeCard(props) {
      const {
        node, isRoot, selected, sites, selectedId,
        dragId, dropTargetId,
        rosterChildren, collapsed, viewMode,
        onSelect, onChange, onAddChild, onAddSibling, onDelete,
        onToggleSite, onToggleType, onToggleCollapsed, onToggleViewMode,
        onDragStart, onDragOver, onDragLeave, onDrop, onDragEnd
      } = props;
      const isGroup = node.type === "group";
      const isDragging = dragId === node.id;
      const isDropTarget = dropTargetId === node.id;
      const hasChildren = node.children && node.children.length > 0;
      const showListInside = !!rosterChildren;
      return (
        <div
          className={
            "node" +
            (isRoot ? " root" : "") +
            (isGroup ? " group" : "") +
            (selected ? " selected" : "") +
            (isDragging ? " dragging" : "") +
            (isDropTarget ? " drop-target" : "")
          }
          data-dept={node.dept}
          draggable={!isRoot}
          onClick={e => { e.stopPropagation(); onSelect(node.id); }}
          onDragStart={e => onDragStart(e, node.id)}
          onDragEnd={onDragEnd}
          onDragOver={e => onDragOver(e, node.id)}
          onDragLeave={e => onDragLeave(e, node.id)}
          onDrop={e => onDrop(e, node.id)}
        >
          <span className="accent" />

          {!isGroup && (
            <Editable
              className="role"
              value={node.role}
              onChange={v => onChange(node.id, { role: v })}
              placeholder="Role"
              onClick={() => onSelect(node.id)}
            />
          )}
          {isGroup && (
            <Editable
              className="role"
              value={node.role}
              onChange={v => onChange(node.id, { role: v })}
              placeholder="Site type"
              onClick={() => onSelect(node.id)}
            />
          )}

          <Editable
            className="name"
            value={node.name}
            onChange={v => onChange(node.id, { name: v })}
            placeholder={isGroup ? "Site name" : "Full name"}
            onClick={() => onSelect(node.id)}
          />

          <SiteChips
            sites={sites}
            active={node.sites}
            selected={selected}
            onToggle={(siteId) => onToggleSite(node.id, siteId)}
          />

          {showListInside && (
            <div className="roster" onMouseDown={e => e.stopPropagation()}>
              {rosterChildren.map(c => (
                <RosterRow
                  key={c.id}
                  node={c}
                  selected={selectedId === c.id}
                  sites={sites}
                  dragId={dragId}
                  dropTargetId={dropTargetId}
                  onSelect={onSelect}
                  onChange={onChange}
                  onDelete={onDelete}
                  onToggleSite={onToggleSite}
                  onDragStart={onDragStart}
                  onDragOver={onDragOver}
                  onDragLeave={onDragLeave}
                  onDrop={onDrop}
                  onDragEnd={onDragEnd}
                />
              ))}
              <button
                className="roster-add"
                onClick={e => { e.stopPropagation(); onAddChild(node.id); }}
              >+ Add member</button>
            </div>
          )}

          <div className="actions">
            {hasChildren && (
              <button
                className="node-btn view"
                title={viewMode === "list" ? "Switch to tree view" : "Switch to compact list"}
                onClick={e => { e.stopPropagation(); onToggleViewMode(node.id); }}
              >{viewMode === "list" ? "⊟" : "≡"}</button>
            )}
            {!isRoot && (
              <button
                className="node-btn swap"
                title={isGroup ? "Convert to person" : "Convert to site/group"}
                onClick={e => { e.stopPropagation(); onToggleType(node.id, isGroup ? "person" : "group"); }}
              >{isGroup ? "◐" : "▣"}</button>
            )}
            {!isRoot && (
              <button
                className="node-btn del"
                title="Delete node and its branches"
                onClick={e => { e.stopPropagation(); onDelete(node.id); }}
              >×</button>
            )}
          </div>

          <div className="below">
            {!showListInside && (
              <button
                className="pill-btn"
                title="Add a direct report"
                onClick={e => { e.stopPropagation(); onAddChild(node.id); }}
              >+ Report</button>
            )}
            {!isRoot && (
              <button
                className="pill-btn"
                title="Add a peer at the same level"
                onClick={e => { e.stopPropagation(); onAddSibling(node.id); }}
              >+ Peer</button>
            )}
          </div>

          {hasChildren && !showListInside && (
            <button
              className="expand-toggle"
              onClick={e => { e.stopPropagation(); onToggleCollapsed(node.id); }}
              title={collapsed ? "Expand subordinates" : "Collapse subordinates"}
            >
              <span className="chev">{collapsed ? "▸" : "▾"}</span>
              <span>{node.children.length}</span>
            </button>
          )}
        </div>
      );
    }

    /* ---------- Tree renderer ---------- */
    function TreeNode(props) {
      const { node, isRoot, selectedId, ...rest } = props;
      const collapsed = !!node.collapsed;
      const viewMode = getViewMode(node);
      const hasChildren = node.children && node.children.length > 0;
      const showRosterInside = hasChildren && !collapsed && viewMode === "list";
      const showTreeBranches = hasChildren && !collapsed && viewMode === "tree";
      return (
        <li>
          <NodeCard
            node={node}
            isRoot={isRoot}
            selected={selectedId === node.id}
            selectedId={selectedId}
            rosterChildren={showRosterInside ? node.children : null}
            collapsed={collapsed}
            viewMode={viewMode}
            {...rest}
          />
          {showTreeBranches && (
            <ul>
              {node.children.map(c => (
                <TreeNode key={c.id} node={c} isRoot={false} selectedId={selectedId} {...rest} />
              ))}
            </ul>
          )}
        </li>
      );
    }

    /* ---------- Legend ---------- */
    function Legend({ sites, onShortChange, onLabelChange }) {
      return (
        <div className="legend">
          {sites.map(s => (
            <span className="item" key={s.id}>
              <span className="swatch" data-site={s.id}></span>
              <span
                className="short"
                contentEditable
                suppressContentEditableWarning
                spellCheck={false}
                onInput={e => onShortChange(s.id, e.currentTarget.textContent || "")}
                onKeyDown={e => { if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); e.currentTarget.blur(); } }}
              >{s.short}</span>
              <span className="dot">·</span>
              <span
                className="label"
                contentEditable
                suppressContentEditableWarning
                spellCheck={false}
                onInput={e => onLabelChange(s.id, e.currentTarget.textContent || "")}
                onKeyDown={e => { if (e.key === "Enter" || e.key === "Escape") { e.preventDefault(); e.currentTarget.blur(); } }}
              >{s.label}</span>
            </span>
          ))}
        </div>
      );
    }

    /* ---------- One-time migrations for saved data ---------- */
    function migrateState(state) {
      if (!state) return state;
      const renameMap = {
        "Extraction Site 1": "Intotroso",
        "Extraction Site 2": "Asuheye",
        "Processing Site": "Akwsiasi",
        "Emmanuel Addai": "?"
      };
      const removeNames = new Set(["Osman Mumuni"]);
      function pruneAndRename(node) {
        const kids = (node.children || [])
          .filter(c => !removeNames.has(c.name))
          .map(pruneAndRename);
        const newName = renameMap[node.name] || node.name;
        // Promote generic "Site" group role into Extraction / Processing based on assigned sites
        let newRole = node.role;
        if (node.type === "group" && (node.role === "Site" || !node.role)) {
          const sitesArr = node.sites || [];
          if (sitesArr.includes("proc")) newRole = "Processing Site";
          else newRole = "Extraction Site";
        }
        return { ...node, name: newName, role: newRole, children: kids };
      }
      const tree = state.tree ? pruneAndRename(state.tree) : state.tree;
      const sites = (state.sites || []).map(s => {
        if (s.id === "ext1" && (s.label === "Extraction Site 1" || !s.label))
          return { ...s, label: "Intotroso", short: (s.short === "EXT-1" ? "INT" : s.short) };
        if (s.id === "ext2" && (s.label === "Extraction Site 2" || !s.label))
          return { ...s, label: "Asuheye", short: (s.short === "EXT-2" ? "ASU" : s.short) };
        if (s.id === "proc" && (s.label === "Processing Site" || !s.label))
          return { ...s, label: "Akwsiasi", short: (s.short === "PROC" ? "AKW" : s.short) };
        return s;
      });
      return { tree, sites };
    }

    /* ---------- App ---------- */
    function App() {
      // Initial state: URL hash > localStorage > defaults
      const initial = (() => {
        const fromHash = decodeStateFromHash(location.hash);
        if (fromHash && fromHash.tree && fromHash.sites) return migrateState(fromHash);
        try {
          const tree = JSON.parse(localStorage.getItem(STORAGE_KEY_TREE) || "null");
          const sites = JSON.parse(localStorage.getItem(STORAGE_KEY_SITES) || "null");
          if (tree && sites) return migrateState({ tree, sites });
        } catch(e) {}
        return { tree: DEFAULT_TREE, sites: DEFAULT_SITES };
      })();

      const [tree, setTree] = useState(initial.tree);
      const [sites, setSites] = useState(initial.sites);
      const [selectedId, setSelectedId] = useState(null);
      const [showTip, setShowTip] = useState(() => localStorage.getItem(TIP_KEY) !== "0");
      const [dragId, setDragId] = useState(null);
      const [dropTargetId, setDropTargetId] = useState(null);
      const [toast, setToast] = useState(null);

      useEffect(() => { try { localStorage.setItem(STORAGE_KEY_TREE, JSON.stringify(tree)); } catch(e) {} }, [tree]);
      useEffect(() => { try { localStorage.setItem(STORAGE_KEY_SITES, JSON.stringify(sites)); } catch(e) {} }, [sites]);

      // Toast lifecycle
      useEffect(() => {
        if (!toast) return;
        const t = setTimeout(() => setToast(null), 1800);
        return () => clearTimeout(t);
      }, [toast]);

      const handleChange   = useCallback((id, patch) => setTree(t => updateNode(t, id, patch)), []);
      const handleAddChild = useCallback((id) => setTree(t => addChild(t, id)), []);
      const handleAddSibling = useCallback((id) => {
        setTree(t => {
          const parent = findParent(t, id);
          if (!parent) return t;
          return addChild(t, parent.id);
        });
      }, []);
      const handleDelete = useCallback((id) => {
        if (!window.confirm("Delete this node and all of its branches?")) return;
        setTree(t => deleteNode(t, id));
        setSelectedId(null);
      }, []);
      const handleToggleSite = useCallback((id, siteId) => setTree(t => toggleSite(t, id, siteId)), []);
      const handleToggleType = useCallback((id, type) => setTree(t => setNodeType(t, id, type)), []);
      const handleToggleCollapsed = useCallback((id) => setTree(t => {
        const n = findNode(t, id);
        if (!n) return t;
        return setCollapsed(t, id, !n.collapsed);
      }), []);
      const handleToggleViewMode = useCallback((id) => setTree(t => {
        const n = findNode(t, id);
        if (!n) return t;
        const next = getViewMode(n) === "list" ? "tree" : "list";
        return setViewMode(t, id, next);
      }), []);
      const handleExpandAll = () => setTree(t => setCollapsedAll(t, false, false));
      const handleCollapseGroups = () => setTree(t => setCollapsedAll(t, true, true));

      const handleSiteShort = (id, val) => setSites(ss => ss.map(s => s.id === id ? { ...s, short: val } : s));
      const handleSiteLabel = (id, val) => setSites(ss => ss.map(s => s.id === id ? { ...s, label: val } : s));

      // Drag and drop reparenting
      const onDragStart = (e, id) => {
        e.stopPropagation();
        setDragId(id);
        try { e.dataTransfer.setData('text/plain', id); } catch (err) {}
        e.dataTransfer.effectAllowed = "move";
      };
      const onDragOver = (e, id) => {
        if (!dragId) return;
        if (dragId === id) return;
        const dragged = findNode(tree, dragId);
        if (!dragged) return;
        if (isDescendant(dragged, id)) return; // cannot drop into own subtree
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        if (dropTargetId !== id) setDropTargetId(id);
      };
      const onDragLeave = (e, id) => {
        if (dropTargetId === id) setDropTargetId(null);
      };
      const onDrop = (e, id) => {
        e.preventDefault();
        e.stopPropagation();
        if (!dragId) return;
        if (dragId === id) { setDragId(null); setDropTargetId(null); return; }
        setTree(t => reparent(t, dragId, id));
        setDragId(null);
        setDropTargetId(null);
      };
      const onDragEnd = () => {
        setDragId(null);
        setDropTargetId(null);
      };

      const handleReset = () => {
        if (!window.confirm("Reset to the default organigram? Your changes will be lost.")) return;
        setTree(DEFAULT_TREE);
        setSites(DEFAULT_SITES);
        setSelectedId(null);
      };
      const handleExport = () => {
        const payload = { tree, sites };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url; a.download = "vwc-organigram.json";
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };
      const handleImport = (e) => {
        const f = e.target.files?.[0];
        if (!f) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const obj = JSON.parse(ev.target.result);
            if (obj && obj.tree && obj.sites) {
              setTree(obj.tree); setSites(obj.sites);
            } else if (obj && obj.id) {
              setTree(obj);
            } else {
              alert("Invalid file.");
            }
          } catch (err) { alert("Could not read file."); }
        };
        reader.readAsText(f);
        e.target.value = "";
      };
      const handlePrint = () => window.print();
      const handleShare = async () => {
        const encoded = encodeStateToHash({ tree, sites });
        if (!encoded) { setToast("Could not create share link"); return; }
        const base = location.origin + location.pathname + location.search;
        const url = base + "#data=" + encoded;
        try {
          await navigator.clipboard.writeText(url);
          history.replaceState(null, "", "#data=" + encoded);
          setToast("Share link copied to clipboard");
        } catch (e) {
          history.replaceState(null, "", "#data=" + encoded);
          setToast("Link is in the address bar — copy it manually");
        }
      };
      const dismissTip = () => { setShowTip(false); localStorage.setItem(TIP_KEY, "0"); };

      const fileInputRef = useRef(null);

      return (
        <div className="app" onClick={() => setSelectedId(null)}>
          <header className="topbar">
            <div className="brand">
              <div className="logo">
                <img src={LOGO_SRC} alt="VWC" />
              </div>
              <div>
                <div className="name">VWC</div>
                <div className="sub">Verenigde West-Afrikaanse Compagnie</div>
              </div>
            </div>
            <div className="topbar-title">Organigram</div>
            <div className="topbar-actions">
              <input ref={fileInputRef} type="file" accept="application/json" onChange={handleImport} style={{display:"none"}} />
              <button className="btn" onClick={handleCollapseGroups} title="Collapse all site/group rosters">Collapse groups</button>
              <button className="btn" onClick={handleExpandAll} title="Expand everything">Expand all</button>
              <button className="btn primary" onClick={handleShare} title="Copy a link that includes the current organigram">Copy share link</button>
              <button className="btn" onClick={() => fileInputRef.current?.click()}>Import</button>
              <button className="btn" onClick={handleExport}>Export JSON</button>
              <button className="btn" onClick={handlePrint}>Print / PDF</button>
              <button className="btn danger" onClick={handleReset}>Reset</button>
            </div>
          </header>

          <main className="canvas" onClick={() => setSelectedId(null)}>
            <div className="stage">
              <div className="page-header">
                <div className="eyebrow">VWC · Mining Operations</div>
                <h1>Organigram</h1>
                <div className="rule"></div>
                <p>Click any text to rename (it auto-selects so you can overwrite) · Drag any card onto another to move it · Click a card and tap chips to set its sites · Use <strong>≡</strong> on a card to switch between tree and compact list view</p>
              </div>

              <Legend
                sites={sites}
                onShortChange={handleSiteShort}
                onLabelChange={handleSiteLabel}
              />

              <div className="tree">
                <ul>
                  <TreeNode
                    node={tree}
                    isRoot={true}
                    selectedId={selectedId}
                    sites={sites}
                    dragId={dragId}
                    dropTargetId={dropTargetId}
                    onSelect={setSelectedId}
                    onChange={handleChange}
                    onAddChild={handleAddChild}
                    onAddSibling={handleAddSibling}
                    onDelete={handleDelete}
                    onToggleSite={handleToggleSite}
                    onToggleType={handleToggleType}
                    onToggleCollapsed={handleToggleCollapsed}
                    onToggleViewMode={handleToggleViewMode}
                    onDragStart={onDragStart}
                    onDragOver={onDragOver}
                    onDragLeave={onDragLeave}
                    onDrop={onDrop}
                    onDragEnd={onDragEnd}
                  />
                </ul>
              </div>

              <div className="footer">VWC · Verenigde West-Afrikaanse Compagnie</div>
            </div>
          </main>

          {toast && <div className="toast">{toast}</div>}

          {showTip && (
            <div className="tip">
              <span>Click text to edit (auto-selects all) · <kbd>Drag</kbd> any card to move it · <kbd>≡</kbd> toggles compact list view · <kbd>▾</kbd> collapses subordinates · Click site chips to assign</span>
              <span className="x" onClick={dismissTip}>✕</span>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
